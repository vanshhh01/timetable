<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timetable</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#07090f;
--surface:#0d1117;
--surface2:#131a24;
--surface3:#1a2333;
--border:rgba(255,255,255,0.07);
--border2:rgba(255,255,255,0.12);
--text:#e2e8f0;
--muted:#64748b;
--muted2:#475569;
--blue:#3b82f6;
--blue-dim:rgba(59,130,246,0.15);
--blue-border:rgba(59,130,246,0.35);
--amber:#f59e0b;
--amber-dim:rgba(245,158,11,0.12);
--amber-border:rgba(245,158,11,0.35);
--green:#10b981;
--green-dim:rgba(16,185,129,0.12);
--green-border:rgba(16,185,129,0.3);
--red:#ef4444;
--red-dim:rgba(239,68,68,0.12);
--red-border:rgba(239,68,68,0.3);
--purple:#8b5cf6;
--purple-dim:rgba(139,92,246,0.12);
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  min-height:100vh;
  padding:0;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
.app{
  width:100%;
  max-width:520px;
  padding:20px 16px 40px;
}

/* ── Header ── */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}
.header-left h1{
  font-size:22px;
  font-weight:700;
  letter-spacing:-0.5px;
  color:#fff;
}
.header-left .date-str{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
  font-family:'JetBrains Mono',monospace;
}
.live-clock{
  font-family:'JetBrains Mono',monospace;
  font-size:20px;
  font-weight:500;
  color:var(--blue);
  background:var(--blue-dim);
  border:1px solid var(--blue-border);
  border-radius:10px;
  padding:8px 14px;
  letter-spacing:1px;
}

/* ── Day Tabs ── */
.day-tabs{
  display:flex;
  gap:4px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:4px;
  margin-bottom:20px;
}
.day-tab{
  flex:1;
  text-align:center;
  padding:8px 4px;
  border-radius:10px;
  font-size:12px;
  font-weight:500;
  color:var(--muted);
  cursor:pointer;
  transition:all .2s;
  user-select:none;
  position:relative;
}
.day-tab:hover{color:var(--text);}
.day-tab.active{
  background:var(--blue);
  color:#fff;
  font-weight:600;
}
.day-tab .today-dot{
  position:absolute;
  bottom:4px;
  left:50%;
  transform:translateX(-50%);
  width:4px;height:4px;
  border-radius:50%;
  background:var(--amber);
}

/* ── Status Cards ── */
.status-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}
.status-card{
  border-radius:16px;
  padding:14px 16px;
  border:1px solid var(--border);
  background:var(--surface);
  position:relative;
  overflow:hidden;
}
.status-card.now{
  background:var(--blue-dim);
  border-color:var(--blue-border);
}
.status-card.next{
  background:var(--amber-dim);
  border-color:var(--amber-border);
}
.status-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
}
.status-card.now::before{background:var(--blue);}
.status-card.next::before{background:var(--amber);}
.s-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
}
.status-card.now .s-label{color:var(--blue);}
.status-card.next .s-label{color:var(--amber);}
.s-name{
  font-size:13px;
  font-weight:600;
  color:#fff;
  line-height:1.3;
  margin-bottom:4px;
}
.s-meta{
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
}
.s-time{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  margin-top:4px;
  font-weight:500;
}
.status-card.now .s-time{color:var(--blue);}
.status-card.next .s-time{color:var(--amber);}

/* ── Lecture Timer ── */
.timer-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:20px;
  display:none;
}
.timer-card.visible{display:block;}
.timer-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.timer-label{
  font-size:11px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
}
.timer-status-badge{
  font-size:10px;
  font-weight:600;
  padding:3px 8px;
  border-radius:20px;
  background:var(--green-dim);
  color:var(--green);
  border:1px solid var(--green-border);
  letter-spacing:.5px;
}
.timer-status-badge.ending{
  background:var(--red-dim);
  color:var(--red);
  border-color:var(--red-border);
}
.timer-subject{
  font-size:15px;
  font-weight:600;
  color:#fff;
  margin-bottom:12px;
}
.progress-wrap{
  background:var(--surface3);
  border-radius:100px;
  height:6px;
  margin-bottom:10px;
  overflow:hidden;
}
.progress-bar{
  height:100%;
  border-radius:100px;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  transition:width .5s ease;
}
.progress-bar.ending{background:linear-gradient(90deg,var(--amber),var(--red));}
.timer-times{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.timer-elapsed{
  font-family:'JetBrains Mono',monospace;
  font-size:26px;
  font-weight:500;
  color:#fff;
  letter-spacing:1px;
}
.timer-remain{
  text-align:right;
}
.timer-remain-val{
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  color:var(--muted);
}
.timer-remain-lbl{
  font-size:10px;
  color:var(--muted2);
  margin-top:1px;
}
.timer-remain-val.ending{color:var(--red);}

/* ── Schedule List ── */
.section-label{
  font-size:11px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted2);
  margin-bottom:10px;
}
.schedule{display:flex;flex-direction:column;gap:6px;}
.slot{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border-radius:12px;
  background:var(--surface);
  border:1px solid var(--border);
  position:relative;
  transition:all .2s;
  cursor:default;
}
.slot.done{opacity:.4;}
.slot.current{
  background:var(--blue-dim);
  border-color:var(--blue-border);
}
.slot.upcoming{
  background:var(--amber-dim);
  border-color:var(--amber-border);
}
.slot.lab-slot{
  background:var(--purple-dim);
  border-color:rgba(139,92,246,0.3);
}
.slot-period{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--muted);
  width:28px;
  flex-shrink:0;
  text-align:center;
}
.slot.current .slot-period{color:var(--blue);}
.slot.upcoming .slot-period{color:var(--amber);}
.slot.lab-slot .slot-period{color:var(--purple);}
.slot-dot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--border2);
  flex-shrink:0;
}
.slot.current .slot-dot{background:var(--blue);box-shadow:0 0 6px var(--blue);}
.slot.upcoming .slot-dot{background:var(--amber);}
.slot.lab-slot .slot-dot{background:var(--purple);}
.slot.done .slot-dot{background:var(--muted2);}
.slot-info{flex:1;min-width:0;}
.slot-name{
  font-size:13px;
  font-weight:600;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.slot.done .slot-name{color:var(--muted);}
.slot-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.slot-right{
  flex-shrink:0;
  text-align:right;
}
.slot-time{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  font-weight:500;
}
.slot.current .slot-time{color:var(--blue);}
.slot.upcoming .slot-time{color:var(--amber);}
.slot-badge{
  font-size:9px;
  font-weight:700;
  padding:2px 6px;
  border-radius:4px;
  margin-top:4px;
  letter-spacing:.5px;
  text-transform:uppercase;
}
.badge-live{background:var(--blue-dim);color:var(--blue);border:1px solid var(--blue-border);}
.badge-next{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber-border);}
.badge-lab{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(139,92,246,0.3);}
.badge-done{background:var(--surface3);color:var(--muted2);}

/* ── Lunch break ── */
.lunch-block{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border-radius:10px;
  background:var(--surface);
  border:1px dashed var(--border2);
  color:var(--muted);
  font-size:12px;
  margin:4px 0;
}
.lunch-block span{font-family:'JetBrains Mono',monospace;font-size:11px;}

/* ── Free slot ── */
.free-slot{
  text-align:center;
  padding:16px;
  color:var(--muted2);
  font-size:13px;
  font-style:italic;
}

/* ── Pulse animation ── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulsing{animation:pulse 2s ease-in-out infinite;}
</style>
</head>
<body>
<div class="app">

<div class="header">
  <div class="header-left">
    <h1>📅 My Timetable</h1>
    <div class="date-str" id="dateStr"></div>
  </div>
  <div class="live-clock" id="clock"></div>
</div>

<div class="day-tabs" id="dayTabs"></div>

<div class="status-row" id="statusRow"></div>

<div class="timer-card" id="timerCard">
  <div class="timer-header">
    <div class="timer-label">Lecture Timer</div>
    <div class="timer-status-badge" id="timerBadge">In Progress</div>
  </div>
  <div class="timer-subject" id="timerSubject"></div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="timer-times">
    <div>
      <div class="timer-elapsed" id="timerElapsed">00:00</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px;">elapsed</div>
    </div>
    <div class="timer-remain">
      <div class="timer-remain-val" id="timerRemain">00:00</div>
      <div class="timer-remain-lbl">remaining</div>
    </div>
  </div>
</div>

<div class="section-label" id="scheduleLabel">Today's Schedule</div>
<div class="schedule" id="schedule"></div>

</div>

<script>
const periods=[
 "08:50-09:40","09:40-10:30","10:40-11:30","11:30-12:20",
 "13:10-14:00","14:00-14:50","14:50-15:40","15:40-16:30"
];

const LUNCH_AFTER=3;

const timetable={
 Monday:[
  {name:"Environment & Sustainability",teacher:"Divyanshi Sharma",room:"RJ-201"},
  {name:"Applied Calculus",teacher:"Ranjeet Kaur",room:"RJ-201"},
  {name:"Applied Physics",teacher:"Isha Mehra",room:"RJ-201"},
  {name:"Basic Electrical Engg",teacher:"Vikash Tiwari",room:"RJ-201"},
  {name:"Physics Lab",teacher:"Isha Mehra",lab:"phy",room:"KC-310"},
  {name:"Physics Lab",teacher:"Isha Mehra",lab:"phy",room:"KC-310"},
  {name:"Data Structure Using C++",teacher:"Ankur Sharma",room:"RJ-201"},
  {name:"Essentials of AI",teacher:"Rahul Singh",room:"RJ-201"}
 ],
 Tuesday:[
  {name:"Data Structure Lab",teacher:"Ankur Sharma",lab:"ds",room:"RJ-201"},
  {name:"Data Structure Lab",teacher:"Ankur Sharma",lab:"ds",room:"RJ-201"},
  {name:"Basic Electrical Engg",teacher:"Vikash Tiwari",room:"RJ-201"},
  {name:"Applied Calculus",teacher:"Ranjeet Kaur",room:"RJ-201"},
  {name:"Essentials of AI",teacher:"Rahul Singh",room:"RJ-201"},
  {name:"Applied Physics",teacher:"Isha Mehra",room:"RJ-201"},
  {name:"Environment & Sustainability",teacher:"Divyanshi Sharma",room:"RJ-201"},
  {name:"Applied Calculus",teacher:"Ranjeet Kaur",room:"RJ-201"}
 ],
 Wednesday:[
  {name:"Basic Electrical Engg",teacher:"Vikash Tiwari",room:"RJ-201"},
  {name:"Applied Physics",teacher:"Isha Mehra",room:"RJ-201"},
  {name:"Applied Calculus",teacher:"Ranjeet Kaur",room:"RJ-201"},
  {name:"Data Structure Using C++",teacher:"Ankur Sharma",room:"RJ-201"},
  {name:"Web Designing Workshop",teacher:"Jitendra Kumar",room:"RJ-201"},
  {name:"Web Designing Workshop",teacher:"Jitendra Kumar",room:"RJ-201"},
  {name:"Mentor Mentee",teacher:"Mentors",room:"RJ-201"},
  null
 ],
 Thursday:[
  {name:"Applied Calculus",teacher:"Ranjeet Kaur",room:"RJ-201"},
  {name:"Data Structure Using C++",teacher:"Ankur Sharma",room:"RJ-201"},
  {name:"CAD Lab",teacher:"Mohit Bansal",lab:"cad",room:"RJ-109"},
  {name:"CAD Lab",teacher:"Mohit Bansal",lab:"cad",room:"RJ-109"},
  {name:"Basic Electrical Engg",teacher:"Vikash Tiwari",room:"RJ-201"},
  {name:"Web Designing Workshop",teacher:"Jitendra Kumar",room:"RJ-201"},
  {name:"Essentials of AI",teacher:"Rahul Singh",room:"RJ-201"},
  {name:"Applied Physics",teacher:"Isha Mehra",room:"RJ-201"}
 ],
 Friday:[
  {name:"Applied Physics",teacher:"Isha Mehra",room:"RJ-201"},
  {name:"Applied Calculus",teacher:"Ranjeet Kaur",room:"RJ-201"},
  {name:"Electrical Lab",teacher:"Vikash Tiwari",lab:"ele",room:"RJ-Basement"},
  {name:"Electrical Lab",teacher:"Vikash Tiwari",lab:"ele",room:"RJ-Basement"},
  {name:"Applied Calculus",teacher:"Ranjeet Kaur",room:"RJ-201"},
  {name:"Data Structure Using C++",teacher:"Ankur Sharma",room:"RJ-201"},
  {name:"Basic Electrical Engg",teacher:"Vikash Tiwari",room:"RJ-201"},
  {name:"Environment & Sustainability",teacher:"Divyanshi Sharma",room:"RJ-201"}
 ]
};

const dayOrder=["Monday","Tuesday","Wednesday","Thursday","Friday"];
const weekdays=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function getRealDay(){return weekdays[new Date().getDay()];}
let selectedDay=dayOrder.includes(getRealDay())?getRealDay():"Monday";

function toMin(t){const[h,m]=t.split(":").map(Number);return h*60+m;}
function pad(n){return String(Math.floor(n)).padStart(2,"0");}
function fmtMs(ms){
  const s=Math.floor(ms/1000);
  const m=Math.floor(s/60);
  const h=Math.floor(m/60);
  if(h>0)return pad(h)+":"+pad(m%60)+":"+pad(s%60);
  return pad(m)+":"+pad(s%60);
}

function mergeLabs(slots){
  const out=[];
  for(let i=0;i<slots.length;i++){
    const cur=slots[i];
    if(!cur){out.push(null);continue;}
    if(cur.lab && slots[i+1] && slots[i+1].lab===cur.lab){
      out.push({...cur,time:periods[i].split("-")[0]+"-"+periods[i+1].split("-")[1],isLab:true,origIdx:i});
      i++;
    }else{
      out.push({...cur,time:periods[i],origIdx:i});
    }
  }
  return out;
}

// Build tabs
const tabsEl=document.getElementById("dayTabs");
dayOrder.forEach(d=>{
  const btn=document.createElement("div");
  btn.className="day-tab"+(d===selectedDay?" active":"");
  btn.setAttribute("data-day",d);
  btn.innerHTML=d.slice(0,3);
  const realToday=getRealDay();
  if(d===realToday){
    const dot=document.createElement("div");
    dot.className="today-dot";
    btn.appendChild(dot);
  }
  btn.onclick=()=>{
    selectedDay=d;
    document.querySelectorAll(".day-tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render();
  };
  tabsEl.appendChild(btn);
});

function render(){
  const now=new Date();
  const curMin=now.getHours()*60+now.getMinutes();
  const realDay=getRealDay();
  const isToday=(realDay===selectedDay);

  document.getElementById("clock").textContent=
    now.toLocaleTimeString("en-IN",{hour12:false});
  document.getElementById("dateStr").textContent=
    now.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"});

  const slots=timetable[selectedDay]||[];
  const merged=mergeLabs(slots);

  let currentCls=null, nextCls=null;
  merged.forEach(cls=>{
    if(!cls)return;
    const[s,e]=cls.time.split("-").map(toMin);
    if(isToday && curMin>=s && curMin<e && !currentCls) currentCls=cls;
    else if(isToday && curMin<s && !nextCls) nextCls=cls;
    else if(!isToday && !nextCls) nextCls=cls;
  });

  const sr=document.getElementById("statusRow");
  sr.innerHTML=`
  <div class="status-card now">
    <div class="s-label">Now</div>
    <div class="s-name">${currentCls?currentCls.name:"No class"}</div>
    <div class="s-meta">${currentCls?currentCls.teacher:"—"}</div>
    <div class="s-meta">${currentCls?"📍 "+currentCls.room:""}</div>
    <div class="s-time">${currentCls?currentCls.time:""}</div>
  </div>
  <div class="status-card next">
    <div class="s-label">Next</div>
    <div class="s-name">${nextCls?nextCls.name:"No upcoming"}</div>
    <div class="s-meta">${nextCls?nextCls.teacher:"—"}</div>
    <div class="s-meta">${nextCls?"📍 "+nextCls.room:""}</div>
    <div class="s-time">${nextCls?nextCls.time:""}</div>
  </div>`;

  const tc=document.getElementById("timerCard");
  if(currentCls && isToday){
    tc.classList.add("visible");
    const[sMin,eMin]=currentCls.time.split("-").map(toMin);
    const totalMs=(eMin-sMin)*60000;
    const elapsedMs=(curMin-sMin)*60000+(now.getSeconds()*1000+now.getMilliseconds());
    const remainMs=totalMs-elapsedMs;
    const pct=Math.min(100,Math.max(0,(elapsedMs/totalMs)*100));
    const isEnding=remainMs<600000;

    document.getElementById("timerSubject").textContent=currentCls.name;
    document.getElementById("timerElapsed").textContent=fmtMs(elapsedMs);
    document.getElementById("timerRemain").textContent=fmtMs(Math.max(0,remainMs));
    document.getElementById("progressBar").style.width=pct.toFixed(1)+"%";

    const pb=document.getElementById("progressBar");
    const badge=document.getElementById("timerBadge");
    const rv=document.getElementById("timerRemain");
    if(isEnding){
      pb.classList.add("ending");
      badge.classList.add("ending");
      badge.textContent="Ending Soon";
      rv.classList.add("ending");
      badge.classList.add("pulsing");
    }else{
      pb.classList.remove("ending");
      badge.classList.remove("ending");
      badge.textContent="In Progress";
      rv.classList.remove("ending");
      badge.classList.remove("pulsing");
    }
  }else{
    tc.classList.remove("visible");
  }

  document.getElementById("scheduleLabel").textContent=
    isToday?"Today's Schedule":selectedDay+"'s Schedule";

  const schedEl=document.getElementById("schedule");
  schedEl.innerHTML="";

  let lunchInserted=false;
  let periodCount=0;

  merged.forEach((cls,i)=>{
    if(!lunchInserted && cls && cls.origIdx>=LUNCH_AFTER+1){
      if(!merged.slice(0,i).some(c=>c&&c.origIdx>LUNCH_AFTER)){
        const lb=document.createElement("div");
        lb.className="lunch-block";
        lb.innerHTML='<span style="font-size:16px">🍽️</span><span>Lunch Break</span><span style="margin-left:auto">12:20 – 13:10</span>';
        schedEl.appendChild(lb);
        lunchInserted=true;
      }
    }

    if(!cls){
      const fr=document.createElement("div");
      fr.className="free-slot";
      fr.textContent="Free period";
      schedEl.appendChild(fr);
      return;
    }

    periodCount++;
    const[sMin,eMin]=cls.time.split("-").map(toMin);
    let status="";
    let badgeHtml="";

    if(isToday){
      if(curMin>=sMin && curMin<eMin){
        status="current";
        badgeHtml='<div class="slot-badge badge-live pulsing">● Live</div>';
      } else if(curMin<sMin && cls===nextCls){
        status="upcoming";
        badgeHtml='<div class="slot-badge badge-next">Next</div>';
      } else if(curMin>=eMin){
        status="done";
        badgeHtml='<div class="slot-badge badge-done">Done</div>';
      }
    }

    if(cls.isLab && status!=="current" && status!=="done"){
      status+=" lab-slot";
      if(!badgeHtml) badgeHtml='<div class="slot-badge badge-lab">Lab</div>';
    }

    const slot=document.createElement("div");
    slot.className="slot "+status;
    slot.innerHTML=`
      <div class="slot-period">${periodCount}</div>
      <div class="slot-dot"></div>
      <div class="slot-info">
        <div class="slot-name">${cls.name}</div>
        <div class="slot-sub">👤 ${cls.teacher} &nbsp;📍 ${cls.room}</div>
      </div>
      <div class="slot-right">
        <div class="slot-time">${cls.time}</div>
        ${badgeHtml}
      </div>`;
    schedEl.appendChild(slot);
  });

  if(!lunchInserted){
    const lb=document.createElement("div");
    lb.className="lunch-block";
    lb.innerHTML='<span style="font-size:16px">🍽️</span><span>Lunch Break</span><span style="margin-left:auto">12:20 – 13:10</span>';
    schedEl.insertBefore(lb, schedEl.children[4]||null);
  }
}

setInterval(render,1000);
render();
</script>
</body>
</html>
